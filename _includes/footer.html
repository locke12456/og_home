  <ul class="ft-links"><li><a href="{{ t.base | append: '/devlog/' | relative_url }}">{{ t.devlog_title }}</a></li><li><a href="{{ t.base | append: '/devlog/feed.xml' | relative_url }}">RSS</a></li><li><a href="#">{{ t.footer_terms }}</a></li><li><a href="#">{{ t.footer_privacy }}</a></li><li><a href="#">{{ t.footer_contact }}</a></li></ul>

</footer>
