title: 轉生者們
tagline: 官方網站
description: 扮演掌管轉生的神祇，引導異界的靈魂成為勇者，為混亂的世界帶來平衡。
url: https://lockestudio.net
baseurl: ""
lang: zh-Hant
timezone: Asia/Taipei

permalink: /devlog/:year/:month/:title/
markdown: kramdown
kramdown:
  input: GFM

plugins: []

# Languages: zh-Hant lives at /, English under /en/ (en/_posts for its posts).
# A translation pairs with its original by the same file slug (posts) or `ref` (pages).
languages: [zh-Hant, en]

defaults:
  - scope: { path: "" }
    values: { layout: default, lang: zh-Hant }
  - scope: { path: "", type: posts }
    values: { layout: post, body_class: sub, lang: zh-Hant }
  - scope: { path: "en" }
    values: { lang: en, locale: en_US }
  - scope: { path: "en", type: posts }
    values: { lang: en, locale: en_US, permalink: "/en/devlog/:year/:month/:title/" }

# Devlog categories: front matter `cat:` uses the key; CSS colours live in .c-<key>.
# Labels per language; `tag` is the banner badge.
devlog_cats:
  system:    { zh-Hant: 系統,   en: System,    tag: SYSTEM }
  art:       { zh-Hant: 美術,   en: Art,       tag: ART }
  fix:       { zh-Hant: 修正,   en: Fix,       tag: FIX }
  milestone: { zh-Hant: 里程碑, en: Milestone, tag: MILESTONE }
  info:      { zh-Hant: 情報,   en: Info,      tag: INFO }

exclude:
  - README.md
  - "*.meta"
  - "**/*.meta"
