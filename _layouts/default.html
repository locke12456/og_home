{%- assign t = site.data.i18n[page.lang] -%}
{%- include lang-alt.html -%}
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% include seo.html %}
<link type="application/atom+xml" rel="alternate" href="{{ t.base | append: '/devlog/feed.xml' | absolute_url }}" title="{{ t.brand }} · {{ t.devlog_title }}">
{%- if zh_url %}
<link rel="alternate" hreflang="zh-Hant" href="{{ zh_url }}">
<link rel="alternate" hreflang="x-default" href="{{ zh_url }}">
{%- endif %}
{%- if en_url %}
<link rel="alternate" hreflang="en" href="{{ en_url }}">
{%- endif %}
<link rel="icon" href="{{ '/assets/svg/emblem.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
{% include sprite.html %}
{% include header.html %}

<main>
{{ content }}
</main>

{% include footer.html %}

<a class="pagetop" href="#top" aria-label="{{ t.pagetop }}"><svg><use href="#i-arrow"/></svg></a>

<script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
